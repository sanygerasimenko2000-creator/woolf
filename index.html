<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Woolf Toolkit</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; background: #0f172a; color: #fff; }
    textarea { width: 100%; height: 100px; background: #1e293b; color: #fff; border: 1px solid #334155; padding: 10px; }
    button { padding: 10px 15px; margin-top: 10px; background: #38bdf8; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    pre { background: #1e293b; padding: 10px; margin-top: 10px; border-radius: 4px; color: #a5f3fc; }
  </style>
</head>
<body>
  <h1>⚡ Woolf Developer Toolkit</h1>
  <textarea id="inp" placeholder='{"status":"ok"}'></textarea>
  <br>
  <button onclick="f()">Format JSON</button>
  <pre id="out">// Output</pre>
  <script>
    function f(){try{document.getElementById('out').textContent=JSON.stringify(JSON.parse(document.getElementById('inp').value),null,2)}catch(e){document.getElementById('out').textContent='Error: '+e.message}}
  </script>
</body>
</html>
